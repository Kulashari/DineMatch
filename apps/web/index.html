<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DineMatch turns restaurant preferences into an explainable shortlist."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const storedTheme = localStorage.getItem("dinematch-theme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        document.documentElement.dataset.theme = storedTheme || systemTheme;
      })();
    </script>
    <title>DineMatch — Find your next great meal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dinematch.bootstrap/main.tsx"></script>
  </body>
</html>
